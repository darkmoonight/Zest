name: zest
description: Task management application.

publish_to: "none"

version: 1.6.1+55

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: "^3.44.8"

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0

  # Local storage
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.6

  # Localization & formatting
  intl: ^0.20.2
  slang: ^4.18.0
  slang_flutter: ^4.18.0

  # Timezone
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Android widgets & background work
  # workmanager: ^0.9.0+3
  # home_widget: ^0.9.2
  quick_actions: ^1.1.0

  # Notifications
  flutter_local_notifications: ^22.2.0

  # UI & theming
  gap: ^3.0.1
  shimmer: ^3.0.0
  google_fonts: ^8.2.0
  dynamic_system_colors: ^1.9.0
  material_color_utilities: ^0.13.0
  iconsax_plus: ^1.0.0
  line_awesome_flutter: ^3.0.1
  reorderables: ^0.6.0
  flex_color_picker: ^3.8.0
  sleek_circular_slider: ^2.1.0
  table_calendar: ^3.2.0
  omni_datetime_picker: ^2.3.2
  flutter_heatmap_calendar: ^1.0.5
  fl_chart: ^1.2.0

  # Platform & utilities
  archive: ^4.0.7
  device_info_plus: ^13.2.0
  display_mode: ^0.0.2
  file_selector: ^1.1.0
  flag_secure: ^2.0.2
  package_info_plus: ^10.2.1
  restart_app: ^1.8.3
  url_launcher: ^6.3.2

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.1
  isar_community_generator: ^3.3.2
  slang_build_runner: ^4.18.0

  # Linting
  flutter_lints: ^6.0.0

  # App assets (splash & launcher icons)
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter_native_splash:
  color: "#181818"
  android_12:
    color: "#181818"
  image: "assets/icons/icon.png"

flutter:
  generate: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
