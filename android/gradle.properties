org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode = false
# App module migrated off kotlin-android (uses kotlin { compilerOptions } DSL).
# Keep built-in Kotlin disabled until these plugins stop applying KGP:
# device_calendar_plus_android, flag_secure, dynamic_system_colors.
# (workmanager_android / flutter_timezone already skip KGP when this is true.)
android.builtInKotlin=false
android.newDsl=false
